<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENDA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📌 Minha Agenda</h1>
    <input id="tarefa" type="text" placeholder="Insira aqui sua tarefa">
    <input id="seleciona-data" type="date">
    <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
    <div id="aviso" style="color:red; margin-top:10px;"></div>
    <div id="Lista-De-Tarefas"></div>

    <script>
       
        let afazeres;
        const afazeresSalvos = JSON.parse(localStorage.getItem("afazeres"));
        if(Array.isArray(afazeresSalvos)){
            afazeres = afazeresSalvos;
        } else {
            afazeres = [
               {nome: "Lavar louça", data: "15-08-2025", id: "id1"},
               {nome: "Lavar banheiro", data: "20-08-2025", id: "id2"},
               {nome: "Estender roupa", data: "25-08-2025", id: "id3"},
               {nome: "Assistir jogo do Corinthians", data: "16-08-2025", id: "id4"}
           ];
        }

        const salvarTarefa = () => localStorage.setItem("afazeres", JSON.stringify(afazeres));
        salvarTarefa();

        
        let adicionarTarefa = () => {
            const campoTarefa = document.getElementById("tarefa");
            const tarefa = campoTarefa.value.trim();

            const aviso = document.getElementById("aviso");

            if(tarefa === "") {
                aviso.textContent = "⚠️ Não há tarefa para adicionar!";
                return; 
            }

            aviso.textContent = ""; 

            const campoData = document.getElementById("seleciona-data");
            const prazo = campoData.value;

            const cron = "" + new Date().getTime();

            afazeres.push ({
                nome: tarefa, 
                data: prazo,
                id: cron
            });

            salvarTarefa();
            renderizar();

          
            campoTarefa.value = "";
            campoData.value = "";
        }

       
        const apagarTarefa = (evento) => {
            const botaoApagar = evento.target; 
            const idSerApagado = botaoApagar.id;
            afazeres = afazeres.filter((tarefa) => tarefa.id !== idSerApagado);
            salvarTarefa();
            renderizar();
        };

       
        const renderizar =() => {
            const listaDeTarefas = document.getElementById("Lista-De-Tarefas");
            listaDeTarefas.innerHTML = "";

            afazeres.forEach((tarefa) => {
                const elemento = document.createElement('div');
                elemento.innerHTML = tarefa.nome + " 📅 " + tarefa.data;

                const botaoApagar = document.createElement("button");
                botaoApagar.innerText = "Apagar";
                botaoApagar.style = "margin-left: 15px";
                botaoApagar.id = tarefa.id;
                botaoApagar.onclick = apagarTarefa;

                elemento.appendChild(botaoApagar);
                listaDeTarefas.appendChild(elemento);
            });
        }

        renderizar();
    </script>
</body>
</html>
